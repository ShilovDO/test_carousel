# carousel_frotend/nginx.conf
server {
    listen 5077;
    server_name _;  # Принимает запросы на любой домен/IP
    
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Для React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API запросов на backend
    location /api {
        proxy_pass http://backend:5087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Увеличиваем таймауты для долгих запросов
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Проксирование изображений
    location /images {
        proxy_pass http://backend:5087;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}