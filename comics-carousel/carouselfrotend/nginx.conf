# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name roadpsy.ru www.roadpsy.ru;
    return 301 https://$host$request_uri;
}

# Основной HTTPS сервер
server {
    listen 443 ssl;
    http2 on;
    server_name roadpsy.ru www.roadpsy.ru;
    client_max_body_size 500M;

    # SSL сертификаты
    ssl_certificate     /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/yourdomain.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://carouselbackend:5087/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cookie_domain ~^(.*)$ roadpsy.ru;
        proxy_cookie_path / "/;";
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie $http_cookie;
        
        add_header Access-Control-Allow-Credentials "true";
        add_header Access-Control-Expose-Headers "Set-Cookie";
    }

    location /images/ {
        proxy_pass http://carouselbackend:5087/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cache-Control "no-store";
        expires off;
    }
    
    location ~ ^/(css|js|fonts|public)/ {
        proxy_pass http://carouselbackend:5087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}