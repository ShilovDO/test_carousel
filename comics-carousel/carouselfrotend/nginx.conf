server {
    listen 80;
    server_name 176.108.249.27;
    client_max_body_size 500M;
    
    types {
        image/webp webp;
        image/jpeg jpg jpeg;
        image/png png;
        image/gif gif;
    }
    
    # Сначала обрабатываем статические файлы
    location ~* \.(webp|jpg|jpeg|png|gif|css|js|ico|json)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Для webp явно указываем Content-Type
        if ($request_filename ~* \.webp$) {
            add_header Content-Type image/webp;
        }
        
        try_files $uri =404;  # Важно: не отправлять index.html
    }
    
    # Специальная обработка для папки images
    location /images/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        
        # Проверяем существование файла
        try_files $uri =404;
    }
    
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://carouselbackend:5087/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cookie_domain ~^(.*)$ "176.108.249.27";
        proxy_cookie_path / "/;";
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie $http_cookie;
        
        add_header Access-Control-Allow-Credentials "true";
        add_header Access-Control-Expose-Headers "Set-Cookie";
    }
}