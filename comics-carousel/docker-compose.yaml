services:
  backend:
    build:
      context: .
      dockerfile: server/dockerfile
    container_name: comics_backend
    environment:
      NODE_ENV: production
      # Используем существующую БД (измените на свои данные)
      DATABASE_URL: postgresql://postgres:PasswordDBWEB2025&@176.108.249.27:5432/database_comics
      PORT: 3001
      # Добавляем CORS для работы с внешним фронтом
      CORS_ORIGIN: "*"
    volumes:
      - images_data:/app/public/images
    ports:
      - "3001:3001"
    networks:
      - comics_network
    restart: unless-stopped
    # Добавляем healthcheck
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/images', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: comics_frontend
    ports:
      - "80:80"
    networks:
      - comics_network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  images_data:
    driver: local

networks:
  comics_network:
    driver: bridge