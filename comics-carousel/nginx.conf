server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Увеличиваем максимальный размер загружаемых файлов
    client_max_body_size 50M;
    
    # Обработка API запросов - прокси на бэкенд
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для загрузки изображений
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Раздача изображений
    location /images {
        proxy_pass http://backend:3001/images;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Кэширование изображений на стороне клиента
        add_header Pragma "public";
        add_header Vary "Accept-Encoding";
    }
    
    # Для всех остальных маршрутов отдаем index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Кэширование статических ассетов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Включаем gzip сжатие
        gzip_static on;
        gzip_vary on;
    }
    
    # Сжатие текстовых файлов
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}